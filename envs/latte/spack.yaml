# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  specs:
  - openblas
  - bml@master~mpi~magma #+magma+cusolver to enable latte with gpu 
  - qmd-progress@6b03dfca14428a9c479d1e0e96453ee62758644c~mpi~benchmarks
  - latte@=lattepy+interface+progress~mpi
  - metis
  - py-pip
  - python@3.12.12
  view: true
  concretizer:
    unify: true
