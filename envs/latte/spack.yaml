# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  specs:
  - cuda+allow-unsupported-compilers
  - openmpi schedulers=auto
  - openblas
  - bml@master~magma #+magma+cusolver to enable latte with gpu 
  - qmd-progress@6b03dfca14428a9c479d1e0e96453ee62758644c~benchmarks
  - latte@=lattepy+interface+mpi+progress
  - py-pip
  - python@3.13.2
  view: true
  concretizer:
    unify: true
