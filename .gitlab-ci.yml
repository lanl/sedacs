# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Python.gitlab-ci.yml

# Official language image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/python/tags/
image: continuumio/miniconda3:latest

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PDM_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pdm"
  OMPI_MCA_mca_base_component_show_load_errors: 0
  OMPI_CC: gcc # Set the Open MPI C compiler to gcc
  OMPI_CXX: g++ # Set the Open MPI C++ compiler to g++

# https://pip.pypa.io/en/stable/topics/caching/
cache:
  paths:
    - .cache/pip
    - .cache/pdm

stages: # List of stages for jobs, and their order of execution
  - setup
  - build
  - test
  - deploy

before_script:
  - conda update --yes conda
  - conda --version # For debugging
  - conda create -n myenv python=3.10 -y
  - conda install -c conda-forge openmpi cmake mpi4py scipy mdtraj -y
  - export PATH=$CONDA_PREFIX/bin:$PATH  # Ensure the conda bin directory is in PATH
  - source activate myenv
  - python --version ; pip --version # For debugging
  - pip install pdm
  - pdm --version # For debugging

setup:
  stage: setup
  script:
    - source activate myenv
    - pdm install

test:
  stage: test
  script:
    - source activate myenv
    - pip install ruff tox # you can also use tox
    - pip install --editable ".[test]"
    - tox -e py,ruff

run:
  stage: build
  script:
    - source activate myenv
    - pip install .
    # run the command here
  artifacts:
    paths:
      - build/*

pages:
  stage: deploy
  script:
    - source activate myenv
    - pip install sphinx sphinx-rtd-theme
    - cd docs
    - make html
    - mv build/html/ ../public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  script:
    - source activate myenv
    - echo "Deploying application..."
    - echo "Application successfully deployed."
  environment: production
