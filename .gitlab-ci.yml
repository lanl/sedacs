# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Python.gitlab-ci.yml
image: gcc

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  OMPI_MCA_mca_base_component_show_load_errors: 0
  OMPI_CC: gcc # Set the Open MPI C compiler to gcc
  OMPI_CXX: g++ # Set the Open MPI C++ compiler to g++

stages: # List of stages for jobs, and their order of execution
  - setup
  - build
  - test
  - deploy

before_script:
  - "${SHELL} <(curl -L micro.mamba.pm/install.sh)"
  - source ~/.bashrc
  - micromamba config append channels conda-forge
  - micromamba config set channel_priority strict
  - micromamba --version # For debugging
  - micromamba create -n myenv python=3.10 -y # Create a new environment with Python
  - micromamba activate myenv
  - python --version ; pip --version # For debugging
  - pip install pdm
  - pdm --version # For debugging

setup:
  stage: setup
  script:
    - pdm install

test:
  stage: test
  script:
    - pip install ruff tox # you can also use tox
    - pip install --editable ".[test]"
    - tox --listenvs-all # List the available environments for debugging
    - tox -e py # Do not run ruff by now

run:
  stage: build
  script:
    - pip install .
    # run the command here
  artifacts:
    paths:
      - build/*

pages:
  stage: deploy
  script:
    - pip install sphinx sphinx-press-theme myst-parser
    - cd docs
    - make sphinx
    - mv _build/sphinx/html/ ../public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."
  environment: production
